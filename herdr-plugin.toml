id = "kodingwarrior.wiff"
name = "wiff"
version = "0.1.0"
min_herdr_version = "0.8.0"
description = "Review wiff code-review sessions inside herdr, and route human comments back to the agent that owns the diff."
platforms = ["macos", "linux"]

[[build]]
command = ["npm", "ci"]

[[build]]
command = ["npm", "run", "build"]

[[panes]]
id = "review"
title = "wiff review"
placement = "split"
command = ["sh", "-c", "exec node \"$HERDR_PLUGIN_ROOT/dist/bin/pane.js\" review"]

[[panes]]
id = "review-pr"
title = "wiff review (PR)"
placement = "split"
command = ["sh", "-c", "exec node \"$HERDR_PLUGIN_ROOT/dist/bin/pane.js\" review-pr"]

[[events]]
on = "pane.closed"
command = ["node", "dist/bin/event.js"]

[[events]]
on = "pane.exited"
command = ["node", "dist/bin/event.js"]

[[actions]]
id = "wiff-review"
title = "wiff: review changes"
contexts = ["workspace", "pane"]
command = ["node", "dist/bin/action.js", "wiff-review"]

[[actions]]
id = "wiff-send-review"
title = "wiff: send review to agent"
contexts = ["pane"]
command = ["node", "dist/bin/action.js", "wiff-send-review"]

[[actions]]
id = "wiff-reload"
title = "wiff: reload the open review"
contexts = ["workspace", "pane"]
command = ["node", "dist/bin/action.js", "wiff-reload"]

[[actions]]
id = "wiff-review-pr"
title = "wiff: review this branch's pull request"
contexts = ["workspace", "pane"]
command = ["node", "dist/bin/action.js", "wiff-review-pr"]

[[actions]]
id = "wiff-sync"
title = "wiff: sync review to the pull request"
contexts = ["workspace", "pane"]
command = ["node", "dist/bin/action.js", "wiff-sync"]

[[actions]]
id = "wiff-refresh"
title = "wiff: refresh the review session"
contexts = ["workspace", "pane"]
command = ["node", "dist/bin/action.js", "wiff-refresh"]
